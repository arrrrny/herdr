# Fork-native release: builds the herdr binary (with fork changes) on every
# push to development and publishes it as a GitHub Release.
#
# Platforms: x86_64-unknown-linux-musl (linux64) and x86_64-apple-darwin
# (macOS Intel) only.

name: Fork Native Release

on:
  push:
    branches:
      - development
  workflow_dispatch:
  schedule:
    # Daily re-release so the binary always tracks the latest upstream sync
    - cron: "10 3 * * *"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
  LIBGHOSTTY_VT_SIMD: "true"

jobs:
  native-build:
    name: Native build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: herdr-linux-x86_64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: herdr-darwin-x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.16-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.16-${{ runner.os }}-

      - name: Install Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.16
          echo "$(brew --prefix zig@0.16)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.16)/bin/zig" version

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools zip

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: fork-release-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr herdr

      - name: Package native artifact
        run: |
          zip -j ${{ matrix.name }}.zip herdr
          shasum -a 256 ${{ matrix.name }}.zip > ${{ matrix.name }}.zip.sha256

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-fork-${{ matrix.target }}
          retention-days: 3
          path: |
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.zip.sha256
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: herdr-fork-*
          path: dist-native-release
          merge-multiple: true

      - name: Delete old nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            Built from the development branch with fork changes.

            Platforms: x86_64-unknown-linux-musl (linux64), x86_64-apple-darwin (macOS Intel)
            Source commit: ${{ github.sha }}
        run: |
          gh release create nightly \
            dist-native-release/* \
            --title "herdr fork nightly (${{ steps.version.outputs.version }})" \
            --notes "$RELEASE_NOTES"
